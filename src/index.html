<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Road Travel — plan a drive, weather timed to arrival</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- This file is the APP SHELL, not a landing page: the marketing copy and the SEO surface live
         in public/landing.html, served at / (ADR-0038). Keep this short — it describes the planner,
         which is client-rendered and deliberately not the indexable page. The canonical points at the
         landing page because that is the page we want ranked for the product. -->
    <meta name="description" content="Plan a drive and see the weather for every stretch of the route at the hour you'll actually be there, plus a plain-language AI briefing on when to leave." />
    <link rel="canonical" href="https://roadtravel.info/" />

    <!-- Design 6a type (docs/DESIGN_SYSTEM.md): Nunito 600/700/800, system-ui fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />

    <!-- Brand kit (docs/BRANDING.md): SVG favicon first, PNG fallbacks; dark variants follow the
         OS scheme (favicon surfaces can't see the in-app theme toggle). -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="apple-touch-icon" href="pwa-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#e9f1f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1722" media="(prefers-color-scheme: dark)" />

    <!-- Social cards. og:image MUST be an absolute URL — Reddit (the primary launch channel) and
         most other unfurlers do not resolve a root-relative path, so the preview silently loses its
         image. The night variant was a second og:image tag, which just made the choice ambiguous;
         one canonical image is what unfurlers actually want. -->
    <meta property="og:title" content="Road Travel" />
    <meta property="og:description" content="Weather along your route, time-shifted to your ETA — with an AI briefing." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://roadtravel.info/" />
    <meta property="og:image" content="https://roadtravel.info/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://roadtravel.info/og-image.png" />
    <!-- Apply the saved appearance before first paint to avoid a light/dark flash. -->
    <script>
      try {
        var t = localStorage.getItem('rt.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
